    <script nonce="oxoggjimQ35pcq1wHhl2yQ==" type="application/ld+json">{"@context":"http://schema.org/","@type":"Dataset","name":"MushR-Annotated-Dataset (Oyster Mushrooms)","description":"# MushR General Summary:\n**MushR** is a modular and scalable gourmet mushroom growing and harvesting system that goes beyond the state of the art, which merely monitors and controls the growing environment, by introducing an image recognition system that determines when and which mushrooms are ready to be harvested in conjunction with a proof-of-concept of an automated mushroom harvesting mechanism for harvesting the mushrooms without human interaction. The image recognition setup monitors the growing status of the mushrooms and guides the harvesting process. We present a Mask R-CNN model for the detection of oyster mushroom maturity as well as a semi-automated harvesting system, integrating a Raspberry Pi for control, an electrical switch, an air compressor, and a pneumatic cylinder with a cutting knife to facilitate timely mushroom harvesting. The modularity and scalability of the system allow for industry-level usage and can be scaled according to the required mushroom-growing systems within the facility.\n\n#MushR Dataset:\nThe dataset created for this project focuses on capturing images of the mushroom-growing environment from three different perspectives within each of our two growth tents for mushroom production. Instead of providing images of every individual bucket and mushroom, we capture the overall scene and its variations. The images from each perspective are captured simultaneously and automatically hourly. This approach allows for monitoring the development and maturity of the oyster mushrooms over time. We captured and accumulated 34,400 images over ten months to ensure a comprehensive dataset. This repository contains the annotated files that we used to train the model. The raw data is available as well: [Link](https://www.kaggle.com/datasets/etcelab/mushr-project-raw-image-dataset-oyster-mushrooms)\n\n# Further Resources: \nThe AI model, a digital twin for mushroom production, the setup of our growth and control chambers, and additional information are all made available under an open-source license.\n\n- MushR Github Repository (AI model digital twin, etc.) - [Link](https://github.com/ETCE-LAB/MushR)","url":"https://www.kaggle.com/etcelab/mushr-annotated-dataset-oyster-mushrooms","version":1,"keywords":["subject, people and society, business","subject, earth and nature"],"license":{"@type":"CreativeWork","name":"CC BY-SA 4.0","url":"https://creativecommons.org/licenses/by-sa/4.0/"},"identifier":["6127324"],"includedInDataCatalog":{"@type":"DataCatalog","name":"Kaggle","url":"https://www.kaggle.com"},"creator":{"@type":"Person","name":"ETCE-LAB","url":"https://www.kaggle.com/etcelab","image":"https://storage.googleapis.com/kaggle-avatars/thumbnails/15706878-kg.png"},"distribution":[{"@type":"DataDownload","requiresSubscription":true,"encodingFormat":"zip","fileFormat":"zip","contentUrl":"https://www.kaggle.com/datasets/etcelab/mushr-annotated-dataset-oyster-mushrooms/download?datasetVersionNumber=1","contentSize":"7890170061 bytes"}],"commentCount":0,"dateModified":"2024-11-20T11:14:14.987Z","discussionUrl":"https://www.kaggle.com/etcelab/mushr-annotated-dataset-oyster-mushrooms/discussion","alternateName":"","isAccessibleForFree":true,"thumbnailUrl":"https://storage.googleapis.com/kaggle-datasets-images/new-version-temp-images/default-backgrounds-101.png-15706878/dataset-card.png","interactionStatistic":[{"@type":"InteractionCounter","interactionType":"http://schema.org/CommentAction","userInteractionCount":0},{"@type":"InteractionCounter","interactionType":"http://schema.org/DownloadAction","userInteractionCount":61},{"@type":"InteractionCounter","interactionType":"http://schema.org/ViewAction","userInteractionCount":671},{"@type":"InteractionCounter","interactionType":"http://schema.org/LikeAction","userInteractionCoun
